<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Funcionário</title>

    <link rel="icon" href="../Imagens/waysafe-logo.svg">
    <link rel="stylesheet" href="../CSS/editar_ADM.css">
    <link rel="stylesheet" href="../CSS/nav.css">
    <link rel="stylesheet" href="../CSS/modais.css"> <!-- CSS dos modais -->
</head>

<body id="body">

    <div class="fundo">

        <aside class="nav">
            <button class="toggle-nav">☰ </button>

            <div class="perfil">
                <img src="../Imagens/waysafe-logo.svg" class="img_user" alt="logo"> <br>
                <a href="#"><img src="../icons/engrenagem.png" alt="config"></a>
            </div>

            <ul class="menu-list">
                <li class="active">
                    <a href="adm.html"><img src="../icons/funcionarios.png" class="icon" alt=""></a>
                    <a href="adm.html" class="text">Administradores</a>
                </li>

                <li>
                    <img src="../Imagens/apartamento.png" class="icon" alt="">
                    <a href="adm_conc.html" class="text">Concessionárias</a>
                </li>

                <li>
                    <img src="../Imagens/imgNivelDeAcesso.png" class="icon" alt="">
                    <a href="nivelAcesso.html" class="text">Niveis de Acesso</a>
                </li>

                <li>
                    <a href="perfil.html"><img src="../Imagens/user_attributes_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24 (1).png" class="icon" alt=""></a>
                    <a href="perfil.html" class="text">Perfil</a>
                </li>

                <a class="sair" href="../index.html">
                    <div>Voltar</div>
                </a>
            </ul>

        </aside>

        <main class="container">

            <div class="cadastro-bar">
                <a href="adm.html"><img src="../icons/seta-esquerda.png" alt="Voltar"></a>
                <h1>Editar Funcionário</h1>
            </div>

            <div class="container-de-baixo">
                <div class="pagcadastro">

                    <div class="title1-cadastro">
                        <div class="infos">
                            <h3>Informações do Funcionário</h3>
                            <p>Editar as informações do funcionário</p>
                        </div>
                    </div>

                    <hr>

                    <!-- FORMULARIO: mantive IDs para compatibilidade com seu JS -->
                    <form class="campos-cadastro" id="formEditar" onsubmit="event.preventDefault(); Validar();">

                        <div class="coluna-cadastro">
                            <label class="label-cadastro" for="input_nome">Nome Completo</label>
                            <input type="text" class="input-cadastro" placeholder="Ex: João Martins" id="input_nome">

                            <label class="label-cadastro" for="input_email">Email</label>
                            <input type="email" class="input-cadastro" placeholder="email@gmail.com" id="input_email">
                        </div>

                        <div class="coluna-cadastro">
                            <label class="label-cadastro" for="input_nivel">Nível de acesso</label>
                            <input type="text" class="input-cadastro" placeholder="1 ou 2" value="1" id="input_nivel" disabled>
                        </div>

                    </form>

                    <div class="acao-rodape">
                        <button id="btn-editar" onclick="Validar()" class="btn-cadastrar-func">Editar</button>
                    </div>

                </div>
            </div>

        </main>
    </div>

    <!-- MODAL 1: CONFIRMAR EDIÇÃO -->
    <div id="modal-confirmar" class="modal">
        <div class="modal-content">
            <h2>Confirmar Edição</h2>
            <p>Tem certeza que deseja salvar as alterações?</p>

            <div class="modal-buttons">
                <button id="confirmar-edicao">Sim</button>
                <button id="cancelar-edicao">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- MODAL ERRO -->
    <div id="modalErro" class="modal">
        <div class="modal-content">
            <h3>Erro</h3>
            <p id="mensagem-Erro"></p>
        </div>
    </div>

    <!-- MODAL 2: SUCESSO -->
    <div id="modal-sucesso" class="modal">
        <div class="modal-content">
            <h2>Sucesso!</h2>
            <p>As informações foram atualizadas.</p>

            <div class="modal-buttons" style="justify-content: center;">
                <button id="fechar-sucesso" style="background:#429050; color:white;">OK</button>
            </div>
        </div>
    </div>

    <!-- Script (mantive caminho e não alterei funções) -->
    <script src="../js/editar_Administrador.js"></script>

</body>

</html>
