<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

     <link rel="icon" href="../Imagens/waysafe-logo.svg">
    <link rel="stylesheet" href="../CSS/cadastrofunc.css">
    <link rel="stylesheet" href="../CSS/nav.css">
    <link rel="stylesheet" href="../CSS/modais.css"> <!-- CSS dos modais -->
</head>

<body id="body">

    <div class="fundo">

         <aside class="nav">
       <button class="toggle-nav">☰ </button>

          <div class="perfil">
                <img class="img_user" src="../icons/user.png"> 
                <a href=""></a><img src="../icons/engrenagem.png">  
            </div>

            <ul class="menu-list">
                  <li class="active">
                    <a href="adm.html"><img src="../icons/funcionarios.png" class="icon"></a>
                    <a href="adm.html" class="text">Administradores</a>
                </li>

                <li >
                    <img src="../Imagens/apartamento.png" class="icon">
                    <a href="adm_conc.html" class="text">Concessionárias</a>
                </li>

                <li >
                    <img src="../Imagens/imgNivelDeAcesso.png" class="icon">
                    <a href="nivelAcesso.html" class="text">Niveis de Acesso</a>
                </li>

                <li>
                   <a href="perfil.html"> <img src="../Imagens/user_attributes_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24 (1).png" class="icon" > </a>
                    <a href="perfil.html" class="text">Perfil</a>
                </li>
            </ul>

            <a class="sair" href="../previas.html">
                <div>Voltar</div>
            </a>
        </aside>

        <main class="container">

            <div class="cadastro-bar">
                <a href="adm.html"><img src="../icons/seta-esquerda.png" alt="Voltar"></a>
                <h1>Editar Funcionário</h1>
            </div>

            <div class="container-de-baixo">
                <div class="pagcadastro">

                    <div class="title1-cadastro">
                        <div class="infos">
                            <h3>Informações do Funcionário</h3>
                            <p>Editar as informações do funcionário</p>
                        </div>
                    </div>

                    <hr>

                    <form class="campos-cadastro">

                        <div class="coluna-cadastro">
                            <label class="label-cadastro">Nome Completo</label>
                            <input type="text" class="input-cadastro" placeholder="Ex: João Martins" id="input_nome">

                            <label class="label-cadastro">Email</label>
                            <input type="email" class="input-cadastro" placeholder="email@gmail.com" id="input_email">
                        </div>

                        <div class="coluna-cadastro">
                           <label class="label-cadastro">Nivel de acesso</label>
                            <input type="text" class="input-cadastro" placeholder="1 ou 2" value="1" disabled>
                        </div>

                    </form>

                    <button id="btn-editar" onclick="Validar()" class="btn-cadastrar-func">Editar</button>

                </div>
            </div>

        </main>
    </div>

    <!-- MODAL 1: CONFIRMAR EDIÇÃO -->
    <div id="modal-confirmar" class="modal">
        <div class="modal-content">
            <h2>Confirmar Edição</h2>
            <p>Tem certeza que deseja salvar as alterações?</p>

            <div class="modal-buttons">
                <button id="confirmar-edicao">Sim</button>
                <button id="cancelar-edicao">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="modalErro" class="modal">
        <div class="modal-content">
            <h3>Erro</h3>
            <p id="mensagem-Erro"></p>
        </div>
    </div>

    <!-- MODAL 2: SUCESSO -->
    <div id="modal-sucesso" class="modal">
        <div class="modal-content">
            <h2>Sucesso!</h2>
            <p>As informações foram atualizadas.</p>

            <div class="modal-buttons" style="justify-content: center;">
                <button id="fechar-sucesso" style="background:#429050; color:white;">OK</button>
            </div>
        </div>
    </div>
<!-- // perfil.js há uma configuração semelhante ao que seria usado em editar, mas não é citado aqui.
// CHECAR possibilidade de reciclar informações para esse ponto. -->
    <script src="../js/editar_Administrador.js">
        
    </script>

</body>

</html>
