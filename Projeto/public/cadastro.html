<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/cadastro.css">
    <title>Tela de Cadastro</title>
</head>

<body>
    <a href="index.html" class="btn_voltar">Voltar</a>

    <div id="msg" class="container-txt">
            <div class="caixa-de-texto-container" id="caixaTexto">
                <p id="texto-caixa">Alterações realizadas com sucesso</p>
                
            </div>
    </div>

    

    <div class="div_cadastro">
        <h3 class="logo_cadastro">Way<a class="cor_safe">Safe</a></h3>
        <h1 class="text_cadastro">Cadastro</h1>

        <div class="div_input_cadastro">
            <h3 class="text_input">Nome:</h3>
            <input type="text" class="input_cadastro" id="input_nome" placeholder="Digite seu nome">

            <h3 class="text_input">Email:</h3>
            <input type="email" class="input_cadastro" id="input_email" placeholder="Digite seu email">

            
            <h3 class="text_input">Senha:</h3>
            <input type="password" class="input_cadastro" id="input_senha" placeholder="Crie uma senha">

            <h3 class="text_input">Código da empresa:</h3>
            <input type="number" class="input_cadastro" id="input_fk_empresa" placeholder="Digite o codigo da sua empresa">


            <button onclick="Validar()">Cadastrar</button>

            <a class="conta" href="login.html">Já tenho uma conta</a>
        </div>
    </div>

</body>
</html>
<script src="js/cadastro.js">
    
</script>
