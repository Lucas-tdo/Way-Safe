<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rodovias</title>
  <link rel="stylesheet" href="CSS/rodovias.css">
  <link rel="stylesheet" href="CSS/nav.css">
</head>

<body id="body">
  <div class="fundo">

    <!-- MENU LATERAL -->
    <aside class="nav">
      <button class="toggle-nav">☰ </button>

      <div class="perfil">
        <img class="img_user" src="icons/user.png"> <a href="ADM concessionaria/add_func.html"><img src="icons/engrenagem.png"></a>
      </div>


      <ul class="menu-list">
        <li> <a href="previas.html"> <img src="icons/home.png" class="icon"></img> </a> <a href="previas.html"
            class="text"> Previas</a> </li>

        <li class="active"> <img src="icons/grafico.png" class="icon"></img> <a href="#" class="text">Rodovias</a> </li>

        <li> <a href="acidentes.html"><img src="icons/alerta.png" class="icon"></img></a> <a href="acidentes.html"
            class="text">Acidentes</a> </li>

        <!-- <li> <a href="analise.html"><img src="icons/analise.png" class="icon"></img></a> <a href="analise.html"
            class="text">Análise Detalhada</a> -->
        </li>
      </ul>

      <div class="sair">Sair</div>
    </aside>
    <!--FIM MENU LATERAL-->

    <!--CONTEÚDO-->
    <main class="container">

      <div class="rodovias-bar">
        <h1 style="font-weight: 800;">Rodovias</h1>
      </div>

      <div class="barra">
        <p class="text_over" style="font-weight: 700;">#3 Rodovias com maior acidente</p>
        <div class="barra">
          <p>Ano:</p>

          <select name="" id="select-ano" placeholder="ano" onchange="mudanca_seletor()">
            <option value="">Selecione um ano</option>
          </select>

        </div>
      </div>

      <div class="conteudo-linha">

        <!-- CARDS + TABELA -->
        <div class="conteudo-principal">
          <div class="cards-rodovias">

            <div class="card">
              <div id="card-linha1">
                <span> <span style="font-weight: 600;">1°</span> Rodovia </span>
              </div>
              <h1 id="nome-rodovia1">SP-150</h1>
              <div id="card-linha3">
                <a href="sp150.html" style="text-decoration: none;">
                  <p style="color: rgb(16, 147, 95); font-weight: 500;"
                    onclick="guardarSessionStorage(document.getElementById(`nome-rodovia1`).innerHTML)">Ver Mais</p>
                </a>
              </div>

            </div>

            <div class="card">
              <div id="card-linha1">
                <span> <span style="font-weight: 600;">2°</span> Rodovia </span>
              </div>
              <h1 id="nome-rodovia2">BR-101</h1>
              <div id="card-linha3">
                <a href="sp150.html" style="text-decoration: none;">
                  <p style="color: rgb(16, 147, 95); font-weight: 500;"
                    onclick="guardarSessionStorage(document.getElementById(`nome-rodovia2`).innerHTML)">Ver Mais</p>
                </a>
              </div>
            </div>

            <div class="card">
              <div id="card-linha1">
                <span> <span style="font-weight: 600;">3°</span> Rodovia </span>
              </div>
              <h1 id="nome-rodovia3">SP-280</h1>
              <div id="card-linha3">
                <a href="sp150.html" style="text-decoration: none;">
                  <p style="color: rgb(16, 147, 95); font-weight: 500;"
                    onclick="guardarSessionStorage(document.getElementById(`nome-rodovia3`).innerHTML)">Ver Mais</p>
                </a>
              </div>
            </div>

          </div>
          <div class="barra">
            <p class="tipo">Rodovias com mais acidentes</p>
            <div class="barra">
              <p>Municipio:</p>
              <input type="text" name="" id="select-municipio" placeholder="municipio" list="data-municipio"
                onchange="mudanca_seletor()">
              <datalist id="data-municipio"></datalist>
              </select>
            </div>
          </div>



          <div class="tabela-container">
            <table class="tabela-rodovias">
              <thead>
                <tr>
                  <th style=" border-top-left-radius:7px ;">Rank</th>
                  <th>Rodovia</th>
                  <th>Município</th>
                  <th>Acidente</th>
                  <th>Quantidade de acidentes</th>
                  <th id="th-relatorio" style="border-top-right-radius:7px;">Especificação</th>
                </tr>
              </thead>
              <tbody>

              </tbody>
            </table>
          </div>

        </div>
      </div>

    </main>
  </div>

  <script src="js/rodovias.js">
    
  </script>
</body>

</html>
