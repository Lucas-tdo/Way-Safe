<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SP-150</title>
  <link rel="stylesheet" href="CSS/sp150.css">
  <link rel="stylesheet" href="CSS/nav.css">

  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>

<body>

  <div class="fundo">

    <aside class="nav">
      <button class="toggle-nav">☰ </button>

       <div class="perfil">
        <img class="img_user" src="icons/user.png">  <a href="add_func.html"><img src="icons/engrenagem.png"></a>
      </div>

      <ul class="menu-list">
        <li><img src="icons/home.png" class="icon"><a href="#" class="text">Previas</a></li>

        <li class="active">
          <a href="Rodovias.html"><img src="icons/grafico.png" class="icon"></a>
          <a href="Rodovias.html" class="text">Rodovias</a>
        </li>

        <li>
          <a href="acidentes.html"><img src="icons/alerta.png" class="icon"></a>
          <a href="acidentes.html" class="text">Acidentes</a>
        </li>
      </ul>

      <div class="sair">Sair</div>
    </aside>

    <div class="container">

      <div class="previas-bar">
        <a href="Rodovias.html"><img src="./icons/seta-esquerda.png" alt="Voltar"></a>
        <h1 style="font-weight: 700;">Especificações das Rodovias</h1>
      </div>

      <div class="barra">
        <h1 class="text_over" style="font-weight: 700;">Registro da rodovia SP-150</h1>
      </div>

      <div class="graficos">
        <div class="card_total">
          <div id="card-linha1">
            <p>Rodovia:</p>
          </div>

          <div id="nome-rodovia-tabela">
            <h1 id="nome-rodovia" style="font-weight: 700; font-size: 45px;">SP-150</h1>
          </div>
        </div>

        <div class="card">
          <div class="container-info">
            <div class="card-row row1">

              <p style="font-weight: 700;">Total de acidentes:<span id="qtd_acidentes_total_rodovia"> 150 mil</span></p>
            </div>
          </div>
        </div>
      </div>

      <div class="rank">
        <div class="card_2">
          <span>Tipos de acidentes do último mês</span>
          <div class="grafico-scroll-container">
            <div id="chart-bar"></div>
          </div>
        </div>

        <div class="card_2">
          <span>Top 5 tipos de acidente nos últimos 12 meses</span>
          <div class="grafico-scroll-container">
            <div id="chart-pie"></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // Alterna o menu lateral
    const filtroBox = document.querySelector('.filtro-box');
    document.querySelector('.toggle-nav').addEventListener('click', () => {
      document.querySelector('.nav').classList.toggle('minimizado');
      if (filtroBox) filtroBox.classList.toggle('ativo');
    });

    const coresAcidentes = ['#008FFB', '#00E396', '#FEB019', '#FF4560', '#775DD0'];

    // Gráfico 01 - Barras
    const optionsBar = {
      chart: {
        type: 'bar',
        height: 300,
        width: '100%',
        toolbar: { show: false }
      },
      series: [{
        name: 'Quantidade',
        data: [45, 32, 28, 18]
      }],
      xaxis: {
        categories: ['Colisão traseira', 'Saída de pista', 'Capotamento', 'Atropelamento'],
        labels: {
          style: {
            fontSize: '12px'
          }
        }
      },
      yaxis: {
        labels: {
          style: {
            fontSize: '12px'
          }
        }
      },
      colors: coresAcidentes,
      plotOptions: {
        bar: {
          horizontal: true,
          borderRadius: 4,
          distributed: true
        }
      },
      dataLabels: {
        enabled: true,
        style: {
          fontSize: '11px'
        }
      },
      responsive: [{
        breakpoint: 768,
        options: {
          chart: {
            height: 280
          },
          xaxis: {
            labels: {
              style: {
                fontSize: '10px'
              }
            }
          },
          yaxis: {
            labels: {
              style: {
                fontSize: '10px'
              }
            }
          },
          dataLabels: {
            style: {
              fontSize: '10px'
            }
          }
        }
      }, {
        breakpoint: 480,
        options: {
          chart: {
            height: 250
          },
          xaxis: {
            labels: {
              style: {
                fontSize: '9px'
              },
              trim: true,
              hideOverlappingLabels: true
            }
          },
          yaxis: {
            labels: {
              style: {
                fontSize: '9px'
              }
            }
          },
          dataLabels: {
            enabled: false
          }
        }
      }]
    };

    const chartBar = new ApexCharts(document.querySelector("#chart-bar"), optionsBar);
    chartBar.render();

    // Gráfico 02 - Pizza
    const optionsPie = {
      chart: {
        type: 'pie',
        height: 300,
        width: '100%',
        toolbar: { show: false }
      },
      series: [30, 25, 20, 15, 10],
      labels: ['Colisão traseira', 'Saída de pista', 'Capotamento', 'Atropelamento', 'Outros'],
      colors: coresAcidentes,
      legend: {
        position: 'bottom',
        fontSize: '12px'
      },
      dataLabels: {
        enabled: true,
        style: {
          fontSize: '11px'
        }
      },
      responsive: [{
        breakpoint: 768,
        options: {
          chart: {
            height: 280
          },
          legend: {
            fontSize: '11px',
            position: 'bottom'
          },
          dataLabels: {
            style: {
              fontSize: '10px'
            }
          }
        }
      }, {
        breakpoint: 480,
        options: {
          chart: {
            height: 250
          },
          legend: {
            fontSize: '10px',
            position: 'bottom'
          },
          dataLabels: {
            style: {
              fontSize: '9px'
            }
          }
        }
      }]
    };

    const chartPie = new ApexCharts(document.querySelector("#chart-pie"), optionsPie);
    chartPie.render();
  </script>

<script src="js/rodovia_especifica.js"></script>
</body>

</html>
