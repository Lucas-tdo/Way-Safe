<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador</title>
    <link rel="stylesheet" href="../CSS/adm_func.css">
    <link rel="stylesheet" href="../CSS/nav.css">
     <link rel="icon" href="../Imagens/waysafe-logo.svg">
</head>

<body id="body">
    <div class="fundo">

        <!-- MENU LATERAL -->
        <aside class="nav">
            <button class="toggle-nav">☰ </button>

            <div class="perfil">
                <img class="img_user" src="../icons/user.png">
                <a href="../previas.html"><img src="../icons/engrenagem.png"></a>
                
            </div>



            <ul class="menu-list">
                <li class="active">
                    <a href="#"><img src="../icons/funcionarios.png" class="icon"></a>
                    <a href="#" class="text">Funcionários</a>
                </li>

                <li>
                    <a href="perfil.html"> <img
                            src="../Imagens/user_attributes_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24 (1).png"
                            class="icon"></a>
                    <a href="perfil.html" class="text">Perfil</a>
                </li>



            </ul>

            <a class="sair" href="../previas.html">
                <div>Voltar</div>
            </a>
        </aside>
        <!--FIM MENU LATERAL-->

        <!--CONTEÚDO-->
        <main class="container">

            <div class="rodovias-bar">
                <h1 style="font-weight: 800;">Administração da Concessionária </h1>
            </div>

            <div class="barra">
                <a href="cadastro.html"> <button class="cadastrar" onclick="cadastrar()">Cadastrar</button></a>
                <p> Funcionários</p>
            </div>
            <!-- CARDS + TABELA -->
            <div class="conteudo-principal">
                <div class="cards-rodovias"></div>

                <div class="meio">
                    <span class="tipo">Lista de Funcionários </span>

                    <div class="icones-direita">

                        <img class="icons_meio" src="../icons/atualizar.png" alt="Atualizar" onclick="listar_funcionarios()">
                    </div>
                </div>


                <div class="tabela-container">
                    <table class="tabela-rodovias">
                        <thead>
                            <tr>
                                <th style="border-top-left-radius:7px;">ID</th>
                                <th>Nome</th>
                                <th>Email</th>
                                <th>Senha</th>
                                <th id="th-relatorio" style="border-top-right-radius:7px;">Ação</th>
                            </tr>
                        </thead>
                        <tbody id="lista_funcs">
                        </tbody>
                    </table>
                </div>

            </div>
    </div>

    </main>
    </div>

    <!-- MODAL DE CONFIRMAÇÃO -->
    <div id="modal-confirmar" class="modal">
        <div class="modal-content">
            <h2>Confirmar Exclusão</h2>
            <p>Tem certeza que deseja excluir este funcionário?</p>

            <div class="modal-buttons">
                <button id="confirmar-excluir">Excluir</button>
                <button id="cancelar-excluir">Cancelar</button>
            </div>
        </div>
    </div>


    <script>
        document.querySelector('.toggle-nav')
            .addEventListener('click', () => {
                document.querySelector('.nav').classList.toggle('minimizado');
            });

        /* === MODAL JS === */
        const modal = document.getElementById("modal-confirmar");
        const cancelarBtn = document.getElementById("cancelar-excluir");
        const confirmarBtn = document.getElementById("confirmar-excluir");

        // Abre modal ao clicar na lixeira
        document.querySelectorAll('.icon_tabela[src="../icons/lixo.png"]').forEach(icon => {
            icon.addEventListener('click', (e) => {
                e.preventDefault();
                modal.style.display = "flex";
            });
        });

        // Cancelar fecha o modal
        cancelarBtn.addEventListener('click', () => {
            modal.style.display = "none";
        });

        // Clicar fora fecha
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = "none";
            }
        });

        // Aqui você faz a conexão depois
        confirmarBtn.addEventListener('click', () => {
            alert(" Função de excluir no banco.");
            modal.style.display = "none";
        });


        // Escuta todos cliques da página
        document.addEventListener("click", function (e) {

            // Se clicou no ícone de editar
            if (e.target.classList.contains("icon-tabela")) {

                e.preventDefault();

                // Aqui você coloca a página que vai abrir:
                window.location.href = "editar.html";

            }
        });
    </script>
</body>

</html>
<script src="../js/add_func.js"></script>
