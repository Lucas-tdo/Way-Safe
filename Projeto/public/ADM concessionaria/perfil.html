<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil</title>
  <link rel="stylesheet" href="../CSS/perfil.css">
  <link rel="stylesheet" href="../CSS/nav.css">
  <link rel="icon" href="../Imagens/waysafe-logo.svg">
</head>

<body id="body">
  <div class="fundo">

    <!-- MENU LATERAL -->
    <aside class="nav">
      <button class="toggle-nav">☰ </button>

    

      <div class="perfil">
        <img id="imagem-empresa" class="img_user"> <br>
        <a href="../previas.html"><img src="../icons/engrenagem.png"></a>
      </div>




      <ul class="menu-list">
        <li >
          <a href="add_func.html"><img src="../icons/funcionarios.png" class="icon"></a>
          <a href="add_func.html" class="text">Funcionários</a>
        </li>

        <li class="active">
          <a  href="perfil.html"> <img src="../Imagens/user_attributes_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24 (1).png"
              class="icon"></a>
          <a href="perfil.html" class="text">Perfil</a>
        </li>


      </ul>

      <a class="sair" href="../previas.html">
        <div>Voltar</div>
      </a>
    </aside>
    <!--FIM MENU LATERAL-->

    <!--CONTEÚDO-->
    <main class="container">

      <div class="rodovias-bar">
        <h1 style="font-weight: 800;">Meu Perfil</h1>
      </div>


      <div id="msg" class="container-txt">
        <div class="caixa-de-texto-container" id="caixaTexto">
          <p id="texto-caixa">Alterações realizadas com sucesso</p>
        </div>
      </div>
      <div class="container-de-baixo">





        <div class="pagperfil" style="background-color: rgb(255, 255, 255);">
          <div class="title1-perfil">
            <div style="display: flex; flex-direction: column; gap: 3px;">
              <h3 style="font-weight: 700;">Informações do Perfil</h3>
              <p style="color: rgb(179, 179, 179); ">Gerencie suas informações pessoais e de contato</p>
            </div>

            <div>
              <button id="editarBtn" style="background-color: rgb(255, 255, 255);
                      border: 1px solid rgb(0, 0, 0);
                      padding: 8px 15px;
                      border-radius: 5px;
                      font-weight: 500;
                      cursor: pointer;
                      display: flex;
                      justify-content: center;
                      align-items: center;
                      gap: 2px;
                      color: rgb(0, 0, 0);">
                <img src="../icons/lapisPreto.png" alt="" height="18px"> Editar
              </button>
            </div>
          </div>

          <!--Foto de perfil-->
          <div class="config-foto">
            <div>
              <label for="input-foto" class="foto-perfil" id="fotoContainer">
                <span><img src="../Imagens/photo_camera_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg" alt=""></span>
                <img id="fotoPreview" style="display:none;">
              </label>
              <input type="file" id="input-foto" accept="image/*">
            </div>

            <div>
              <p id="nomeTexto" style="font-weight: 600; font-size: 30px;">João Martins</p>
              <p id="emailTexto" style="color: rgb(87, 87, 87); font-size: 18px; padding-top: 5px;">Email@gmail.com</p>
            </div>
          </div>
          <!--Fim do cod foto de perfil-->

          <hr style="border: 0.5px solid rgba(231, 231, 231, 0.722);">

          <!--Campos de vizualização dos dados-->
          <div class="campos-perfil" id="camposPerfil">

            <div class="coluna-campos1">
              <label style="font-weight: 600;">Nome Completo</label>
              <p class="caixa-de-texto" id="nomeView">João Martins</p>

              <label style="font-weight: 600;">Email</label>
              <p class="caixa-de-texto" id="emailView">email@gmail.com</p>

            </div>

            <div class="coluna-campos1">
              <label id="labelSenhaView" style="font-weight: 600;">Senha</label>
              <p class="caixa-de-texto" id="senhaView">**********</p>

              <p id="pergunta-popup" style="font-weight: 600;">Precisa alterar sua senha?</p>
              <button id="abrir-popup" class="btn-alterar">Alterar senha</button>
              <div class="popup" id="popup">

                <div class="interior-popup">

                  <button id="fechar-popup"><img src="../icons/btn-sair.svg" alt=""></button>
                  <h2 style="font-weight: 700;">Altere sua senha</h2>
                  <label for="input_senha_atual">Insira sua senha atual</label>
                  <input type="password" id="input_senha_atual" class="caixa-de-texto-senha">

                  <label for="input-senha-nova">Insira sua nova senha</label>
                  <input type="password" id="input_senha_nova" class="caixa-de-texto-senha">

                  <label for="input-senha-confirmacao">Confirme sua nova senha</label>
                  <input type="password" id="input_senha_confirmacao" class="caixa-de-texto-senha">

                  <p id="avisos-senha"></p>
                  <h2 id="aviso-sucesso"></h2>

                  <button onclick="pegarSenha()" class="btn-alterar">Alterar senha</button>

                </div>

              </div>

            </div>

          </div>
        </div>
      </div>

    </main>
  </div>

</body>
<script src="../js/perfil.js">
</script>
<script src="../js/foto_perfil.js"></script>

</html>
