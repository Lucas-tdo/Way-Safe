<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil</title>
  <link rel="stylesheet" href="../CSS/perfil.css">
  <link rel="stylesheet" href="../CSS/nav.css">
</head>

<body id="body">
  <div class="fundo">

    <!-- MENU LATERAL -->
    <aside class="nav">
      <button class="toggle-nav">☰ </button>

      <div class="perfil">
        <img class="img_user" src="../icons/user.png">
        <a href="../previas.html"><img src="../icons/engrenagem.png"></a>

      </div>



      <ul class="menu-list">
        <li >
          <a href="add_func.html"><img src="../icons/funcionarios.png" class="icon"></a>
          <a href="add_func.html" class="text">Funcionários</a>
        </li>

        <li class="active">
          <a href="perfil.html"> <img src="../Imagens/user_attributes_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24 (1).png" class="icon"></a>
          <a href="perfil.html" class="text">Perfil</a>
        </li>



      </ul>

      <a class="sair" href="../previas.html">
        <div>Voltar</div>
      </a>
    </aside>
    <!--FIM MENU LATERAL-->

    <!--CONTEÚDO-->
    <main class="container">

      <div class="rodovias-bar">
        <h1 style="font-weight: 800;">Meu Perfil</h1>
      </div>


      <div id="msg" class="container-txt">
        <div class="caixa-de-texto-container" id="caixaTexto">
          <p id="texto-caixa">Alterações realizadas com sucesso</p>
        </div>
      </div>
      <div class="container-de-baixo">





        <div class="pagperfil" style="background-color: rgb(255, 255, 255);">
          <div class="title1-perfil">
            <div style="display: flex; flex-direction: column; gap: 3px;">
              <h3 style="font-weight: 700;">Informações do Perfil</h3>
              <p style="color: rgb(179, 179, 179); ">Gerencie suas informações pessoais e de contato</p>
            </div>

            <div>
              <button id="editarBtn" style="background-color: rgb(255, 255, 255);
                      border: 1px solid rgb(0, 0, 0);
                      padding: 8px 15px;
                      border-radius: 5px;
                      font-weight: 500;
                      cursor: pointer;
                      display: flex;
                      justify-content: center;
                      align-items: center;
                      gap: 2px;
                      color: rgb(0, 0, 0);">
                <img src="../icons/lapisPreto.png" alt="" height="18px"> Editar
              </button>
            </div>
          </div>

          <!--Foto de perfil-->
          <div class="config-foto">
            <div>
              <label for="input-foto" class="foto-perfil" id="fotoContainer">
                <span><img src="../Imagens/photo_camera_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg" alt=""></span>
                <img id="fotoPreview" style="display:none;">
              </label>
              <input type="file" id="input-foto" accept="image/*">
            </div>

            <div>
              <p id="nomeTexto" style="font-weight: 600; font-size: 30px;">João Martins</p>
              <p id="emailTexto" style="color: rgb(87, 87, 87); font-size: 18px; padding-top: 5px;">Email@gmail.com</p>
            </div>
          </div>
          <!--Fim do cod foto de perfil-->

          <hr style="border: 0.5px solid rgba(231, 231, 231, 0.722);">

          <!--Campos de vizualização dos dados-->
          <div class="campos-perfil" id="camposPerfil">

            <div class="coluna-campos1">
              <label style="font-weight: 600;">Nome Completo</label>
              <p class="caixa-de-texto" id="nomeView">João Martins</p>

              <label style="font-weight: 600;">Email</label>
              <p class="caixa-de-texto" id="emailView">email@gmail.com</p>

              <label style="font-weight: 600;">Telefone</label>
              <p class="caixa-de-texto" id="telefoneView">11 99999-9999</p>

            </div>

            <div class="coluna-campos1">
              <label style="font-weight: 600;">CEP</label>
              <p class="caixa-de-texto" id="cepView">00000-000</p>

              <label style="font-weight: 600;">Endereço</label>
              <p class="caixa-de-texto" id="enderecoView">Rua Nome da Rua, 123</p>

              <label>Alterar Senha</label>
              <p class="caixa-de-texto" id="senhaView">**********</p>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script>
    // Menu lateral
    document.querySelector('.toggle-nav')
      .addEventListener('click', () => {
        document.querySelector('.nav').classList.toggle('minimizado');
      });





    // Foto de perfil
    const inputFoto = document.getElementById('input-foto');
    const fotoPreview = document.getElementById('fotoPreview');
    const fotoContainer = document.getElementById('fotoContainer');

    inputFoto.addEventListener('change', function () {
      const arquivo = this.files[0];
      if (arquivo) {
        const leitor = new FileReader();
        leitor.onload = function (e) {
          fotoPreview.src = e.target.result;
          fotoPreview.style.display = 'block';
          fotoContainer.querySelector('span').style.display = 'none';
        }
        leitor.readAsDataURL(arquivo);
      }
    });
    //Fim da lógica para colocar a foto de perfil

    // Alternar modo de edição
    const editarBtn = document.getElementById('editarBtn');
    let editando = false;

    editarBtn.addEventListener('click', () => {
      if (!editando) {
        // Entrar no modo edição
        transformarEmInputs();
        editarBtn.innerHTML = '<img src="../icons/check.svg" alt="" height="18px"> Salvar';
        editando = true;
      } else {
        // Salvar e voltar para visualização
        const msg = document.getElementById("msg");

        msg.classList.add("ativa");

        setTimeout(() => {
          msg.classList.remove("ativa");
        }, 1000); // some depois de 2s

        salvarAlteracoes();
        editarBtn.innerHTML = '<img src="../icons/lapisPreto.png" alt="" height="18px"> Editar';
        editando = false;
      }
    });

    function transformarEmInputs() {
      const campos = ['nome', 'email', 'telefone', 'cep', 'endereco', 'senha'];
      campos.forEach(campo => {
        const p = document.getElementById(`${campo}View`);
        const valor = p.textContent;
        p.outerHTML = `<input style="background-color:#DEDEDE;" class="caixa-de-texto" id="${campo}Input" type="${campo === 'senha' ? 'password' : 'text'}" value="${valor}">`;
      });
    }

    function salvarAlteracoes() {
      const campos = ['nome', 'email', 'telefone', 'cep', 'endereco', 'senha'];
      campos.forEach(campo => {
        const input = document.getElementById(`${campo}Input`);
        const valor = input.value;

        if (campo == 'senha') {
          input.outerHTML = `<p class="caixa-de-texto" id="${campo}View">**********</p>`;
        } else {
          input.outerHTML = `<p class="caixa-de-texto" id="${campo}View">${valor}</p>`;
        }
      });



      document.getElementById('nomeTexto').textContent = document.getElementById('nomeView').textContent;
      document.getElementById('emailTexto').textContent = document.getElementById('emailView').textContent;

    }
  </script>
</body>

</html>
