<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Análise Detalhada</title>
  <link rel="stylesheet" href="CSS/analise_detalhada.css">
  <link rel="stylesheet" href="CSS/nav.css">
  <link rel="icon" href="../public/Imagens/waysafe-logo.svg">
</head>
<body id="body">
  <div class="fundo">

    <!-- MENU LATERAL -->
    <aside class="nav">
      <button class="toggle-nav">☰</button>

      <div class="perfil">
        <img id="imagem-empresa" class="img_user"> <br>
        <a href="#" onclick="direcionar()"><img src="icons/engrenagem.png"></a>
      </div>

      <ul class="menu-list">
        <li><a href="previas.html"><img src="icons/home.png" class="icon" alt="Home"></a><a href="previas.html" class="text">Previas</a></li>
        <li><a href="Rodovias.html"><img src="icons/grafico.png" class="icon" alt="Rodovias"></a><a href="Rodovias.html" class="text">Rodovias</a></li>
        <li><a href="acidentes.html"><img src="icons/alerta.png" class="icon" alt="Acidentes"></a><a href="acidentes.html" class="text">Vítimas</a></li>
        <li class="active"><a href="analise_detalhada.html"><img src="icons/analise.png" class="icon" alt="Análise"></a><a href="analise_detalhada.html" class="text">Análise Detalhada</a></li>
      </ul>

      <a style="text-decoration: none;" href="login.html"><div class="sair">Sair</div></a>
    </aside>
    <!-- FIM MENU LATERAL -->

    <main class="container">

      <div class="analise-bar">
        <h1 style="font-weight: 800;">Análise Detalhada</h1>
      </div>

      <div class="conteudo-linha">
        <div class="conteudo-principal">

          <!-- Filtros superiores -->
          <div class="inputs-padrao filtros-superiores">
            <div class="container-input">
              <label for="inputRodovia">Rodovia</label>
              <input type="text" class="filters" id="inputRodovia" list="data-rodovia" oninput="changeDatas(); mudar()">
              <datalist id="data-rodovia"></datalist>
            </div>

            <div class="container-input">
              <label for="inputMunicipio">Município</label>
              <input type="text" class="filters" id="inputMunicipio" list="data-municipio" oninput="changeDatas(); mudar()">
              <datalist id="data-municipio"></datalist>
            </div>

            <div class="container-input">
              <label for="inputTipo">Tipo acidente</label>
              <input type="text" class="filters" id="inputTipo" list="data-tipo" onchange="mudar()">
              <datalist id="data-tipo"></datalist>
            </div>
          </div>

          <!-- Filtro avançado -->
          <div class="container">
            <details class="expansivel">
              <summary>Filtros</summary>

              <div class="inputs-filtro">

                <div class="inputs-padrao">
                  <div class="container-input">
                    <label for="inputDiaInicio">Dia</label>
                    <div class="inputs-dia">
                      <input type="date" id="inputDiaInicio" onchange="mudar()">
                      <span>à</span>
                      <input type="date" id="inputDiaFinal" onchange="mudar()">
                    </div>
                  </div>

                  <div class="container-input">
                    <label for="inputMetereologia">Meteorologia</label>
                    <select id="inputMetereologia" onchange="mudar()">
                      <option value="">Selecione uma opcao</option>
                      <option value="BOA">Boa</option>
                      <option value="CHUVA">Chuva</option>
                      <option value="NUBLADO">Nublado</option>
                      <option value="GAROA">Garoa</option>
                      <option value="NEBLINA">Neblina</option>
                      <option value="GRANIZO">Granizo</option>
                      <option value="">Sem informação</option>
                    </select>
                  </div>

                  <div class="container-input">
                    <label for="inputVisibilidade">Visibilidade</label>
                    <select id="inputVisibilidade" onchange="mudar()">
                      <option value="">Selecione uma opcao</option>
                      <option value="PARCIAL">Parcial</option>
                      <option value="BOA">Boa</option>
                      <option value="REGULAR">Regular</option>
                      <option value="RUIM">Ruim</option>
                      <option value="">Sem informação</option>
                    </select>
                  </div>
                </div>

                <div class="inputs-padrao">
                  <div class="container-input">
                    <label for="inputDenominacao">Denominação</label>
                    <input class="filters" type="text" id="inputDenominacao" list="data-denominacao" oninput="changeDatas(); mudar()">
                    <datalist id="data-denominacao"></datalist>
                  </div>

                  <div class="container-input">
                    <label for="inputJurisdicao">Jurisdição</label>
                    <input type="text" class="filters" id="inputJurisdicao" list="data-jurisdicao" oninput="changeDatas(); mudar()">
                    <datalist id="data-jurisdicao"></datalist>
                  </div>
                </div>

              </div>
            </details>
          </div>
        </div>
      </div>

      <div class="tabela-container">
        <table class="tabela-rodovias">
          <thead>
            <tr>
              <th style="border-top-left-radius:7px;">Rank</th>
              <th>Rodovia</th>
              <th>Município</th>
              <th>Acidente</th>
              <th>Quantidade de acidentes</th>
            </tr>
          </thead>
          <tbody> 
            <!-- Dados serão inseridos dinamicamente -->
          </tbody>
        </table>
      </div>

    </main>
  </div>

  <script src="./js/analise_detalhada.js"></script>
    <script src="js/foto_perfil.js"></script>
    <script src="js/direcionar_pag.js"></script>
</body>
</html>
