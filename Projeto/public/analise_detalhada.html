<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analise Detalhada</title>
  <link rel="stylesheet" href="CSS/analise_detalhada.css">
  <link rel="stylesheet" href="CSS/nav.css">
</head>

<body id="body">
  <div class="fundo">

    <!-- MENU LATERAL -->
    <aside class="nav">
      <button class="toggle-nav">☰ </button>

      <div class="perfil">
        <img class="img_user" src="icons/user.png"> <a href="ADM concessionaria/add_func.html"><img
            src="icons/engrenagem.png"></a>
      </div>


      <ul class="menu-list">
        <li> <a href="previas.html"> <img src="icons/home.png" class="icon"></img> </a> <a href="previas.html"
            class="text"> Previas</a> </li>

        <li> <a href="Rodovias.html"> <img src="icons/grafico.png" class="icon"></img></a> <a href="Rodovias.html"
            class="text">Rodovias</a> </li>

        <li> <a href="acidentes.html"><img src="icons/alerta.png" class="icon"></img></a> <a href="acidentes.html"
            class="text">Acidentes</a> </li>

        <li class="active"> <a href="analise_detalhada.html"><img src="icons/analise.png" class="icon"></img></a> <a
            href="analise_detalhada.html" class="text">Análise Detalhada</a>
        </li>
      </ul>




      <div class="sair">Sair</div>
    </aside>
    <!--FIM MENU LATERAL-->


    <main class="container">

      <div class="analise-bar">
        <h1 style="font-weight: 800;">Análise Detalhada</h1>
      </div>

      <div class="barra">
        <p>Ano:</p>
        <select name="" id="select-ano" placeholder="ano" onchange="mudanca_seletor()">
          <option value="">Selecione um ano</option>
        </select>
      </div>

      <div class="conteudo-linha">

        <!-- CARDS + TABELA -->
        <div class="conteudo-principal">
          <div class="inputs-padrao">

            <div class="container-input">
              <label for="inputRodovia">Rodovia</label>
              <input type="text" name="" id="inputRodovia">
            </div>

            <div class="container-input">
              <label for="inputMunicipio">Municipio</label>
              <input type="text" name="" id="inputMunicipio">
            </div>

            <div class="container-input">
              <label for="inputTipo">Tipo acidente</label>
              <input type="text" name="" id="inputTipo">
            </div>

          </div>


          <div class="container">
            <!-- Primeira seção expansível -->
            <details class="expansivel">

              <summary>Filtros</summary>

              <div class="inputs-filtro">

                <div class="inputs-padrao">
                  <div class="container-input">
                    <label for="inputDia">Dia</label>
                    <div class="inputs-dia" id="inputDia">
                      <input type="date" name="" id="inputDiaInicio">
                      <span> à </span>
                      <input type="date" name="" id="inputDiaFinal">
                    </div>
                  </div>

                  <div class="container-input">
                    <label for="inputMetereologia">Metereologia</label>
                    <select type="text" name="" id="inputMetereologia">
                      <option value="BOA">Boa</option>
                      <option value="CHUVA">Chuva</option>
                      <option value="NUBLADO">Nublado</option>
                      <option value="GAROA">Garoa</option>
                      <option value="NEBLINA">Neblina</option>
                      <option value="NEBLINA">Neblina</option>
                      <option value="GRANIZO">Granizo</option>
                      <option value="">Sem informação</option> // buscar por SEM INFO/NULO/0 e NÃO INFORMADA no banco
                    </select>
                  </div>

                  <div class="container-input">
                    <label for="inputVisibilidade">Visibilidade</label>
                    <select type="text" name="" id="inputVisibilidade">
                      <option value="PARCIAL">Parcial</option>
                      <option value="BOA">Boa</option>
                      <option value="REGULAR">Regular</option>
                      <option value="RUIM">Ruim</option>

                      <option value="">Sem informação</option> // buscar por SEM INFO/NULO/0
                    </select>
                  </div>
                </div>

                <div class="inputs-padrao">
                  <div class="container-input">
                    <label for="inputDenominacao">Denominacao</label>
                    <input type="text" name="" id="inputDenominacao" list="data-denominacao">
                    <datalist id="data-denominacao"></datalist>
                  </div>

                  <div class="container-input">
                    <label for="inputJurisdicao">Jurisdição</label>
                    <input type="text" name="" id="inputJurisdicao" list="data-jurisdicao">
                    <datalist id="data-jurisdicao"></datalist>
                  </div>

                  <div class="container-input">
                    <label for="inputQuantidade">Quantidade de vitimas</label>
                    <input type="number" name="" id="inputQuantidade">
                  </div>
                </div>

              </div>

          </div>
          </details>
        </div>

      </div>

      <div class="tabela-container">
        <table class="tabela-rodovias">
          <thead>
            <tr>
              <th style=" border-top-left-radius:7px ;">Rank</th>
              <th>Rodovia</th>
              <th>Município</th>
              <th>Acidente</th>
              <th>Quantidade de acidentes</th>
              <th id="th-relatorio" style="border-top-right-radius:7px;">Especificação</th>
            </tr>
          </thead>
          <tbody>
            
          </tbody>
        </table>
      </div>

    </main>

</body>

</html>

<script src="./js/analise_detalhada.js"></script>
