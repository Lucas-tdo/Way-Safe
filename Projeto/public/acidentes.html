<body>
  <div class="fundo">

    <!-- MENU LATERAL -->
    <aside class="nav">
      <button class="toggle-nav">☰ </button>

      <div class="perfil">
        <img id="imagem-empresa" class="img_user"> <br>
        <a href="#" onclick="direcionar()"><img src="icons/engrenagem.png"></a>
      </div>

      <ul class="menu-list">
        <li> <a href="previas.html"><img src="icons/home.png" class="icon"></a> <a href="previas.html"
            class="text">Previas</a></li>

        <li> <a href="Rodovias.html"><img src="icons/grafico.png" class="icon"></a> <a href="Rodovias.html"

        <li class="active"> <img src="icons/alerta.png" class="icon"> <a href="#" class="text">Vítimas</a></li>

        <li> <a href="analise_detalhada.html"><img src="icons/analise.png" class="icon"></img></a>

        <!-- <li> <a href="analise.html"><img src="icons/analise.png" class="icon"></a> <a href="analise.html" class="text">Análise Detalhada</a></li> -->
      </ul>

      <a style="text-decoration: none;" href="login.html"><div class="sair">Sair</div></a>
    </aside>

    <!-- CONTEÚDO -->
    <main class="container">

      <div class="acidentes-bar">
        <h1>Vítimas</h1>
      </div>

      <div class="barra">
        <p class="text_over" style="font-weight: 700;"></p>
        <div class="barra">
          <p>Ano:</p>
          <select class="select_caixa" name="" id="select-ano" onchange="mudanca_seletor(this.value)">
            <option value="">Selecione um ano</option>
          </select>
        </div>
      </div>

      <div class="barra">
        <h1 class="text_over"></h1>
        <h1 class="text_over"></h1>

      </div>

      <div class="conteudo-principal">
        <div class="cards-acidentes">
          <div class="card">
            <p>Municipio com mais vítimas</p>
            <div id="conteudo-total-acid">
              <p style="font-weight: 700;" id="municipio_mais_vitimas">Carregando...</p>
            </div>


          </div>
          <div class="card">
            Tipo de acidente mais recorrente
            <div id="conteudo-total-acid">
              <p style="font-weight: 700;" id="tipo_mais_recorrente">Carregando...</p>
            </div>
          </div>

          <div class="card">
            Total de vítimas
            <div id="conteudo-total-acid">
              <p style="font-weight: 700;" id="total_de_acidentes">Carregando...</p>
            </div>
          </div>

        </div>

        <span class="tipo">Filtragem por quantidade de mês</span>

        <div class="tabela">
          <div class="grafico-scroll-container">
            <div id="grafico-tipos"></div>
          </div>
        </div>

        <div class="tabela">
          <div class="grafico-scroll-container">
            <div id="grafico-municipios"></div>
          </div>
        </div>

      </div>

    </main>
  </div>

  <script src="js/acidentes.js"></script>
    <script src="js/foto_perfil.js"></script>
    <script src="js/direcionar_pag.js"></script>
