<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acidentes</title>
  <link rel="stylesheet" href="CSS/acidentes.css">
  <link rel="stylesheet" href="CSS/nav.css">
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>

<body>
  <div class="fundo">

    <!-- MENU LATERAL -->
    <aside class="nav">
      <button class="toggle-nav">☰ </button>

      <div class="perfil">
        <span class="nome">Olá, Roberto</span>
      </div>

      <ul class="menu-list">
        <li> <a href="previas.html"><img src="icons/home.png" class="icon"></a> <a href="previas.html"
            class="text">Previas</a></li>

        <li> <a href="Rodovias.html"><img src="icons/grafico.png" class="icon"></a> <a href="Rodovias.html"
            class="text">Rodovias</a></li>

        <li class="active"> <img src="icons/alerta.png" class="icon"> <a href="#" class="text">Acidentes</a></li>

        <!-- <li> <a href="analise.html"><img src="icons/analise.png" class="icon"></a> <a href="analise.html" class="text">Análise Detalhada</a></li> -->
      </ul>

      <div class="sair">Sair</div>
    </aside>
    <!-- FIM MENU -->

    <!-- CONTEÚDO -->
    <main class="container">

      <div class="acidentes-bar">
        <h1>Acidentes</h1>
      </div>

      <div class="barra">
        <h1 class="text_over"></h1>
        <h1 class="text_over"></h1>

      </div>

      <div class="conteudo-principal">
        <div class="cards-acidentes">
          <div class="card">
            <p>Total de acidentes (último ano)</p>
            <div id="conteudo-total-acid">
              <p style="font-weight: 700;" id="acidente_30">1.577</p>
            </div>


          </div>
          <div class="card">
            Total de acidentes (últimos 6 meses)
            <div id="conteudo-total-acid">
              <p style="font-weight: 700;" id="acidente_60">2.897</p>
            </div>
          </div>

        </div>

        <span class="tipo">Filtragem por quantidade de dias</span>

        <input type="number" name="" id="periodo_tipos" defaultValue="undefined">
        <button id="botao_filtro">Filtrar dias</button>

        <div class="tabela">
          <div class="grafico-scroll-container">
            <div id="grafico-tipos"></div>
          </div>
        </div>

        <span class="tipo">Evoluções dos acidentes</span>

        <div class="tabela2">
          <div class="grafico-scroll-container">
            <div id="grafico-evolucao"></div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script>
    // Alterna menu (mantido para consistência, mesmo sem filtro)
    document.querySelector('.toggle-nav')
      .addEventListener('click', () => {
        document.querySelector('.nav').classList.toggle('minimizado');
      });

    var quantidade_por_tipo = [];
    var tipos = [];
    var quantidade_evolucao = [];
    var tempo = '';

    //Gráfico 1 - Tipos
    var tiposOptions = {
      chart: {
        type: 'bar',
        height: 350,
        width: '100%',
        toolbar: { show: false },
      },
      series: [{
        name: 'Quantidade de acidentes',
        data: quantidade_por_tipo
      }],
      xaxis: {
        categories: tipos,
        title: {
          text: 'TIPOS DE ACIDENTES',
          style: { 
            fontWeight: 700,
            fontSize: '12px'
          }
        },
        labels: { 
          rotate: -45,
          rotateAlways: true,
          style: {
            fontSize: '11px'
          },
          trim: true,
          hideOverlappingLabels: true
        }
      },
      yaxis: {
        title: {
          text: 'QUANTIDADE DE ACIDENTES',
          style: { 
            fontWeight: 700,
            fontSize: '12px'
          }
        },
        labels: {
          style: {
            fontSize: '11px'
          }
        }
      },
      plotOptions: {
        bar: {
          borderRadius: 6,
          horizontal: false,
          columnWidth: '55%',
          distributed: true // 👈 faz cada barra ter uma cor diferente
        }
      },
      colors: [
        '#0077b6', '#0096c7', '#00b4d8', '#48cae4',
        '#90e0ef', '#ade8f4', '#caf0f8', '#ffafcc',
        '#ff758f', '#fb6f92', '#e36414', '#ffb703',
        '#ff9f1c', '#ff4d6d', '#9d4edd', '#5a189a'
      ], // 👈 paleta variada
      title: {
        text: 'Tipos de acidentes',
        align: 'left',
        style: {
          fontSize: '20px',
          fontWeight: '900',
          color: '#111'
        }
      },
      dataLabels: { 
        enabled: false 
      },
      grid: { 
        borderColor: '#eee',
        padding: {
          left: 10,
          right: 10
        }
      },
      legend: {
        show: false
      },
      responsive: [{
        breakpoint: 768,
        options: {
          chart: {
            height: 320
          },
          title: {
            style: {
              fontSize: '16px'
            }
          },
          xaxis: {
            labels: {
              style: {
                fontSize: '9px'
              }
            },
            title: {
              style: {
                fontSize: '10px'
              }
            }
          },
          yaxis: {
            labels: {
              style: {
                fontSize: '9px'
              }
            },
            title: {
              style: {
                fontSize: '10px'
              }
            }
          }
        }
      }, {
        breakpoint: 480,
        options: {
          chart: {
            height: 280
          },
          title: {
            style: {
              fontSize: '14px'
            }
          },
          xaxis: {
            labels: {
              style: {
                fontSize: '8px'
              },
              rotate: -45
            },
            title: {
              style: {
                fontSize: '9px'
              }
            }
          },
          yaxis: {
            labels: {
              style: {
                fontSize: '8px'
              }
            },
            title: {
              style: {
                fontSize: '9px'
              }
            }
          },
          plotOptions: {
            bar: {
              columnWidth: '70%'
            }
          }
        }
      }]
    };

    var graficoTipos = new ApexCharts(document.querySelector("#grafico-tipos"), tiposOptions);
    graficoTipos.render();

    // gráfico 02 - evolução diária
    //const dias = Array.from({ length: 30 }, (_, i) => `Dia ${i + 1}`);
    //const acidentesDiarios = Array.from({ length: 30 }, () => Math.floor(Math.random() * 80) + 20);

    var evolucaoOptions = {
      chart: {
        type: 'line',
        height: 350,
        width: '100%',
        toolbar: { show: false },
        zoom: { enabled: false }
      },
      series: [{
        name: 'Acidentes por dia',
        data: []
      }],
      xaxis: {
        categories: [],
        title: { 
          text: 'ÚLTIMOS 30 DIAS', 
          style: { 
            fontWeight: 700,
            fontSize: '12px'
          } 
        },
        labels: { 
          rotate: -45,
          rotateAlways: true,
          style: {
            fontSize: '11px'
          },
          trim: true
        }
      },
      yaxis: {
        title: { 
          text: 'QUANTIDADE DE ACIDENTES', 
          style: { 
            fontWeight: 700,
            fontSize: '12px'
          } 
        },
        labels: {
          style: {
            fontSize: '11px'
          }
        }
      },
      stroke: {
        curve: 'smooth',
        width: 3
      },
      markers: {
        size: 4,
        colors: ['#0077b6'],
        strokeColors: '#fff',
        strokeWidth: 2
      },
      colors: ['#0077b6'],
      title: {
        text: 'Evolução dos acidentes nos últimos 30 dias',
        align: 'left',
        style: {
          fontSize: '20px',
          fontWeight: '900',
          color: '#111'
        }
      },
      grid: { 
        borderColor: '#eee',
        padding: {
          left: 10,
          right: 10
        }
      },
      tooltip: { 
        theme: 'light',
        style: {
          fontSize: '12px'
        }
      },
      responsive: [{
        breakpoint: 768,
        options: {
          chart: {
            height: 320
          },
          title: {
            style: {
              fontSize: '16px'
            }
          },
          xaxis: {
            labels: {
              style: {
                fontSize: '9px'
              }
            },
            title: {
              style: {
                fontSize: '10px'
              }
            }
          },
          yaxis: {
            labels: {
              style: {
                fontSize: '9px'
              }
            },
            title: {
              style: {
                fontSize: '10px'
              }
            }
          },
          markers: {
            size: 3
          },
          stroke: {
            width: 2
          }
        }
      }, {
        breakpoint: 480,
        options: {
          chart: {
            height: 280
          },
          title: {
            style: {
              fontSize: '14px'
            }
          },
          xaxis: {
            labels: {
              style: {
                fontSize: '8px'
              },
              rotate: -45
            },
            title: {
              style: {
                fontSize: '9px'
              }
            }
          },
          yaxis: {
            labels: {
              style: {
                fontSize: '8px'
              }
            },
            title: {
              style: {
                fontSize: '9px'
              }
            }
          },
          markers: {
            size: 2
          },
          stroke: {
            width: 2
          }
        }
      }]
    };

    // Renderiza os gráficos
    var graficoLinha = new ApexCharts(document.querySelector("#grafico-evolucao"), evolucaoOptions);
    graficoLinha.render();

    window.addEventListener("load", (event) => {
      total_acidentes(360)
      total_acidentes(180);

      evolucao_acidentes(360); //Deve vir primeiro para definir o tempo(dia, mes ou ano)
      total_acidentes_por_tipo(360);
    });

    document.getElementById("botao_filtro").addEventListener("click", function () {
      evolucao_acidentes(document.getElementById('periodo_tipos').value) //Deve vir primeiro para definir o tempo(dia, mes ou ano)
      total_acidentes_por_tipo(document.getElementById('periodo_tipos').value)
    });


    function total_acidentes(periodo) {

      var fk_empresa = sessionStorage.FK_EMPRESA

      fetch(`/tela_acidentes_rota/total_acidentes/${fk_empresa}/${periodo}`)
        .then(res => res.json())
        .then(total => {

          var qtd = total[0].total;

          console.log(total[0].total);

          if (periodo == 360) {
            document.getElementById("acidente_30").innerText = qtd;
          } else {
            document.getElementById("acidente_60").innerText = qtd;
          }

        })

    }

    function evolucao_acidentes(periodo) {

      var fk_empresa = sessionStorage.FK_EMPRESA

      fetch(`/tela_acidentes_rota/evolucao_acidentes/${fk_empresa}/${periodo}`)
        .then(res => res.json())
        .then(quantidade => {

          quantidade_evolucao = quantidade.quantidades;

          datas = quantidade.labels;
          tempo = quantidade.tipoAgrupamento;
          var tempo_extensao = '';

          console.log(datas);
          console.log(quantidade_evolucao);

          switch (tempo) {
            case 'dia':
              datas.length > 1 ? tempo_extensao = 'dias' : tempo_extensao = 'dia'
              break
            case 'semana':
              datas.length > 1 ? tempo_extensao = 'semanas' : tempo_extensao = 'semana'
              break
            case 'mês':
              datas.length > 1 ? tempo_extensao = 'meses' : tempo_extensao = 'mês'
              break
            case 'ano':
              datas.length > 1 ? tempo_extensao = 'anos' : tempo_extensao = 'ano'
              break
          }

          graficoLinha.updateOptions({
            xaxis: {
              categories: datas
            },
            title: {
              text: `Evolução dos acidentes 
              n${a = (tempo_extensao == 'semana') || (tempo_extensao == 'semanas') ? 'a' : 'o'}
              ${a = !(tempo_extensao == 'mês') && (tempo_extensao.endsWith('s')) ? 's' : ''} 
              últim${a = (tempo_extensao == 'semana') || (tempo_extensao == 'semanas') ? 'a' : 'o'}${a = !(tempo_extensao == 'mês') && (tempo_extensao.endsWith('s')) ? 's' : ''} 
              ${c = datas.length > 1 ? datas.length : ''} ${tempo_extensao}`
            }
          });

          graficoLinha.updateSeries([{
            data: quantidade_evolucao
          }])

        })

    }

    function total_acidentes_por_tipo(periodo) {
      var fk_empresa = sessionStorage.FK_EMPRESA

      fetch(`/tela_acidentes_rota/total_acidentes_por_tipo/${fk_empresa}/${periodo}`)
        .then(res => res.json())
        .then(quantidade => {

          quantidade_por_tipo = quantidade.quantidades;
          tipos = quantidade.tipos;
          var tempo_extensao = '';

          switch (tempo) {
            case 'dia':
              datas.length > 1 ? tempo_extensao = 'dias' : tempo_extensao = 'dia'
              break
            case 'semana':
              datas.length > 1 ? tempo_extensao = 'semanas' : tempo_extensao = 'semana'
              break
            case 'mês':
              datas.length > 1 ? tempo_extensao = 'meses' : tempo_extensao = 'mês'
              break
            case 'ano':
              datas.length > 1 ? tempo_extensao = 'anos' : tempo_extensao = 'ano'
              break
          }

          graficoTipos.updateOptions({
            xaxis: {
              categories: tipos
            },
            title: {
              text: `Tipos de acidentes nos últim${a = (tempo_extensao == 'semana') || (tempo_extensao == 'semanas') ? 'a' : 'o'}${a = !(tempo_extensao == 'mês') && (tempo_extensao.endsWith('s')) ? 's' : ''} 
              ${c = datas.length > 1 ? datas.length : ''} ${tempo_extensao}`
            }
          });

          graficoTipos.updateSeries([{
            data: quantidade_por_tipo
          }])
        })

    }
  </script>
</body>

</html>
